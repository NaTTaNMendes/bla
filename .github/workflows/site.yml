name: Mapa de Calor

# Os votos chegam na hora pelo ntfy.sh (o site já mostra). Este workflow, de tempos em
# tempos, guarda os pedidos novos em dados.json (o ntfy só guarda 12 h) e publica o site.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mapa-de-calor
  cancel-in-progress: false

jobs:
  consolidar:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.salvar.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/consolidar.mjs
      - id: salvar
        run: |
          if git diff --quiet; then echo "mudou=nao" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Mapa de calor: consolida votos"
          git push -q origin HEAD:master
          echo "mudou=sim" >> "$GITHUB_OUTPUT"

  publicar:
    needs: consolidar
    if: github.event_name != 'schedule' || needs.consolidar.outputs.mudou == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
