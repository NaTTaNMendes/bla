app = "mapa-de-calor-bla"
primary_region = "gru"

[build]

[env]
  DB_PATH = "/data/mapa.db"

# O SQLite fica num volume persistente
[[mounts]]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
