<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Calor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="pagina">
      <header>
        <h1>Mapa de Calor</h1>
        <p class="sub">Do amigável ao fedorento. Quem não tem nenhuma classificação fica neutro.</p>
      </header>

      <form id="form-pessoas" class="adicionar">
        <textarea
          id="nomes"
          rows="1"
          placeholder="Adicionar indivíduos — vários de uma vez, separados por vírgula ou um por linha"
          aria-label="Nomes dos indivíduos"
        ></textarea>
        <button class="btn" type="submit">Adicionar</button>
      </form>

      <div class="legenda">
        <span>Frio · amigável</span>
        <div id="barra" class="barra"></div>
        <span>Quente · nojento</span>
      </div>

      <div id="vazio" class="vazio" hidden>
        Ninguém no mapa ainda. <button id="btn-exemplo" class="link">Carregar exemplo</button>
      </div>

      <div class="tabela-wrap">
        <table id="mapa" class="mapa"></table>
      </div>
      <p id="dica" class="dica">Clique numa célula para somar 1 · botão direito tira 1 · clique no nome para editar</p>

      <details class="categorias">
        <summary>Categorias</summary>
        <ul id="lista-categorias"></ul>
        <form id="form-categoria" class="nova-categoria">
          <input id="cat-nome" placeholder="Nova categoria" required aria-label="Nome da categoria" />
          <input id="cat-temp" type="range" min="-100" max="100" step="5" value="0" aria-label="Temperatura" />
          <span id="cat-temp-valor" class="temp">0</span>
          <button class="btn" type="submit">Criar</button>
        </form>
      </details>

      <footer>
        <button id="btn-exportar" class="link">Exportar</button>
        <label class="link">Importar<input id="input-importar" type="file" accept="application/json" hidden /></label>
        <button id="btn-resetar" class="link">Apagar tudo</button>
      </footer>
    </main>

    <dialog id="dialogo" class="dialogo">
      <form method="dialog" id="form-editar">
        <input id="editar-nome" class="editar-nome" required aria-label="Nome" />
        <div id="editar-sliders" class="sliders"></div>
        <p class="resumo">Temperatura <span id="editar-temp" class="temp">0</span></p>
        <div class="acoes">
          <button type="button" id="btn-excluir" class="link perigo">Excluir</button>
          <span class="espaco"></span>
          <button type="button" id="btn-cancelar" class="link">Cancelar</button>
          <button type="submit" class="btn">Salvar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
